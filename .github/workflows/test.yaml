name: Running pytest
on: [push, workflow_dispatch, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        uses: PythonSpring/actions/pytest@main
        with:
          python-version: ${{ matrix.python-version }}
